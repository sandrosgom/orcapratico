    <style>

        .login-logo {
            width: 70px;

        }

        .btn-login:active {
            background: var(--primary-hover);
            transform: scale(.98);
        }

        .btn-register {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 12px;
            background: #e8f0ff;

            font-size: 16px;

            margin-top: 10px;

        }

        .btn-forgot {
            width: 100%;
            height: 42px;

        .btn-reset {
            width: 100%;

        .card {
            background: var(--surface);

           ITENS

        button {

        .btn-add {

        .btn-add:active {
            transform: scale(.98);
        }

        .btn-pdf {

        }

        .btn-pdf:active {

        }

        .total-card {

        .total-line {

        .total-label {

        }

        .app-footer {
            text-align: center;
            padding: 10px 15px 20px;

        }

        @media (max-width: 480px) {
            .app-container {
                padding: 12px;
            }

            .card {
                padding: 15px;
            }

            .item-row {
                grid-template-columns: 62px minmax(0, 1fr) 92px;
            }

            .total-value {
                font-size: 22px;
            }
        }
    </style>
</head>

    <div id="resetScreen">

            <div class="login-card">

    <!-- ==============================

    <script>

        /* ==============================
           SUPABASE
        ============================== */

        const SUPABASE_URL =
            'https://piarcjqbhuzsqvgtwnmh.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_6X6s8W8AQdFq5kGfdCyqIw_Hgay9g9s';

        const {
            createClient
        } = window.supabase;

        const supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* ==============================
           ELEMENTOS
        ============================== */

        const loginScreen =
            document.getElementById('loginScreen');

        const resetScreen =
            document.getElementById('resetScreen');

        const appScreen =
            document.getElementById('appScreen');

        const loginEmail =
            document.getElementById('loginEmail');

        const loginPassword =
            document.getElementById('loginPassword');

        const loginBtn =
            document.getElementById('loginBtn');

        const registerBtn =
            document.getElementById('registerBtn');

        const forgotPasswordBtn =
            document.getElementById('forgotPasswordBtn');

        const logoutBtn =
            document.getElementById('logoutBtn');

        const userEmail =
            document.getElementById('userEmail');

        const loginMessage =
            document.getElementById('loginMessage');

        const newPassword =
            document.getElementById('newPassword');

        const newPasswordConfirm =
            document.getElementById('newPasswordConfirm');

        const saveNewPasswordBtn =
            document.getElementById('saveNewPasswordBtn');

        const backToLoginBtn =
            document.getElementById('backToLoginBtn');

        const resetMessage =
            document.getElementById('resetMessage');


        /* ==============================
           MENSAGENS
        ============================== */

        function showLoginMessage(
            message,
            type = 'error'
        ) {
            loginMessage.textContent = message;
            loginMessage.className =
                'login-message ' + type;
        }

        function clearLoginMessage() {
            loginMessage.textContent = '';
            loginMessage.className =
                'login-message';
        }

        function showResetMessage(
            message,
            type = 'error'
        ) {
            resetMessage.textContent = message;
            resetMessage.className =
                'login-message ' + type;
        }


        /* ==============================
           MOSTRAR APP
        ============================== */

        function showApp(session) {

            if (!session || !session.user) {
                return;
            }

            loginScreen.style.display = 'none';
            resetScreen.style.display = 'none';
            appScreen.style.display = 'block';

            userEmail.textContent =
                session.user.email || '';
        }


        /* ==============================
           MOSTRAR LOGIN
        ============================== */

        function showLogin() {

            loginScreen.style.display = 'flex';
            resetScreen.style.display = 'none';
            appScreen.style.display = 'none';

            userEmail.textContent = '';
        }


        /* ==============================
           MOSTRAR REDEFINIÇÃO
        ============================== */

        function showResetPassword() {

            loginScreen.style.display = 'none';
            resetScreen.style.display = 'flex';
            appScreen.style.display = 'none';

            newPassword.value = '';
            newPasswordConfirm.value = '';

            resetMessage.textContent = '';
            resetMessage.className =
                'login-message';
        }


        /* ==============================
           VERIFICAR SESSÃO
        ============================== */

        async function checkSession() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();

                if (error) {

                    console.error(
                        'Erro ao verificar sessão:',
                        error
                    );

                    showLogin();
                    return;
                }

                const hash =
                    window.location.hash;

                const isRecovery =
                    hash.includes('type=recovery');

                if (isRecovery) {

                    showResetPassword();
                    return;
                }

                if (
                    data &&
                    data.session
                ) {

                    showApp(
                        data.session
                    );

                } else {

                    showLogin();
                }

            } catch (error) {

                console.error(
                    'Erro:',
                    error
                );

                showLogin();
            }
        }


        /* ==============================
           LOGIN
        ============================== */

        loginBtn.addEventListener(
            'click',
            async () => {

                clearLoginMessage();

                const email =
                    loginEmail.value.trim();

                const password =
                    loginPassword.value;

                if (!email) {

                    showLoginMessage(
                        'Digite seu e-mail.'
                    );

                    return;
                }

                if (!password) {

                    showLoginMessage(
                        'Digite sua senha.'
                    );

                    return;
                }

                loginBtn.disabled = true;
                loginBtn.textContent =
                    'Entrando...';

                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email: email,
                                password: password

                            });

                    if (error) {

                        console.error(
                            'Erro no login:',
                            error
                        );

                        showLoginMessage(
                            'E-mail ou senha incorretos.'
                        );

                        return;
                    }

                    if (
                        data &&
                        data.session
                    ) {

                        showApp(
                            data.session
                        );
                    }

                } catch (error) {

                    console.error(error);

                    showLoginMessage(
                        'Não foi possível entrar. Tente novamente.'
                    );

                } finally {

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        'Entrar';
                }
            }
        );


        /* ==============================
           CRIAR CONTA
        ============================== */

        registerBtn.addEventListener(
            'click',
            async () => {

                clearLoginMessage();

                const email =
                    loginEmail.value.trim();

                const password =
                    loginPassword.value;

                if (!email) {

                    showLoginMessage(
                        'Digite o e-mail que deseja usar.'
                    );

                    return;
                }

                if (!password) {

                    showLoginMessage(
                        'Digite uma senha.'
                    );

                    return;
                }

                if (password.length < 6) {

                    showLoginMessage(
                        'A senha precisa ter pelo menos 6 caracteres.'
                    );

                    return;
                }

                registerBtn.disabled = true;

                registerBtn.textContent =
                    'Criando conta...';

                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({

                                email: email,
                                password: password

                            });

                    if (error) {

                        console.error(
                            'Erro ao criar conta:',
                            error
                        );

                        showLoginMessage(
                            error.message
                        );

                        return;
                    }

                    if (
                        data &&
                        data.session
                    ) {

                        showApp(
                            data.session
                        );

                    } else {

                        showLoginMessage(
                            'Conta criada. Agora faça o login.',
                            'success'
                        );
                    }

                } catch (error) {

                    console.error(error);

                    showLoginMessage(
                        'Não foi possível criar a conta.'
                    );

                } finally {

                    registerBtn.disabled =
                        false;

                    registerBtn.textContent =
                        'Criar nova conta';
                }
            }
        );


        /* ==============================
           ESQUECI MINHA SENHA
        ============================== */

        forgotPasswordBtn.addEventListener(
            'click',
            async () => {

                clearLoginMessage();

                const email =
                    loginEmail.value.trim();

                if (!email) {

                    showLoginMessage(
                        'Digite seu e-mail para recuperar a senha.'
                    );

                    return;
                }

                forgotPasswordBtn.disabled = true;

                forgotPasswordBtn.textContent =
                    'Enviando...';

                try {

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        window.location.origin +
                                        window.location.pathname
                                }
                            );

                    if (error) {

                        console.error(
                            'Erro ao recuperar senha:',
                            error
                        );

                        showLoginMessage(
                            error.message
                        );

                        return;
                    }

                    showLoginMessage(
                        'Enviamos um link para redefinir sua senha.',
                        'success'
                    );

                } catch (error) {

                    console.error(error);

                    showLoginMessage(
                        'Não foi possível enviar o e-mail de recuperação.'
                    );

                } finally {

                    forgotPasswordBtn.disabled =
                        false;

                    forgotPasswordBtn.textContent =
                        'Esqueci minha senha';
                }
            }
        );


        /* ==============================
           SALVAR NOVA SENHA
        ============================== */

        saveNewPasswordBtn.addEventListener(
            'click',
            async () => {

                showResetMessage('');

                const password =
                    newPassword.value;

                const confirmation =
                    newPasswordConfirm.value;

                if (!password) {

                    showResetMessage(
                        'Digite a nova senha.'
                    );

                    return;
                }

                if (password.length < 6) {

                    showResetMessage(
                        'A senha precisa ter pelo menos 6 caracteres.'
                    );

                    return;
                }

                if (password !== confirmation) {

                    showResetMessage(
                        'As senhas não são iguais.'
                    );

                    return;
                }

                saveNewPasswordBtn.disabled =
                    true;

                saveNewPasswordBtn.textContent =
                    'Salvando...';

                try {

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .updateUser({
                                password: password
                            });

                    if (error) {

                        console.error(
                            'Erro ao alterar senha:',
                            error
                        );

                        showResetMessage(
                            error.message
                        );

                        return;
                    }

                    showResetMessage(
                        'Senha alterada com sucesso!',
                        'success'
                    );

                    setTimeout(
                        async () => {

                            await supabaseClient
                                .auth
                                .signOut();

                            window.location.hash = '';

                            loginEmail.value = '';
                            loginPassword.value = '';

                            showLogin();

                            showLoginMessage(
                                'Senha alterada. Agora entre com sua nova senha.',
                                'success'
                            );

                        },
                        1500
                    );

                } catch (error) {

                    console.error(error);

                    showResetMessage(
                        'Não foi possível alterar a senha.'
                    );

                } finally {

                    saveNewPasswordBtn.disabled =
                        false;

                    saveNewPasswordBtn.textContent =
                        'Salvar nova senha';
                }
            }
        );


        /* ==============================
           VOLTAR PARA LOGIN
        ============================== */

        backToLoginBtn.addEventListener(
            'click',
            async () => {

                window.location.hash = '';

                await supabaseClient
                    .auth
                    .signOut();

                showLogin();
            }
        );


        /* ==============================
           SAIR
        ============================== */

        logoutBtn.addEventListener(
            'click',
            async () => {

                try {

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();

                    if (error) {

                        console.error(
                            'Erro ao sair:',
                            error
                        );

                        return;
                    }

                    loginEmail.value = '';
                    loginPassword.value = '';

                    clearLoginMessage();

                    showLogin();

                } catch (error) {

                    console.error(error);
                }
            }
        );


        /* ==============================
           OBSERVAR AUTENTICAÇÃO
        ============================== */

        supabaseClient
            .auth
            .onAuthStateChange(
                (
                    event,
                    session
                ) => {

                    if (
                        event ===
                        'PASSWORD_RECOVERY'
                    ) {

                        showResetPassword();
                        return;
                    }

                    if (
                        resetScreen.style.display ===
                        'flex'
                    ) {

                        return;
                    }

                    if (session) {

                        showApp(session);

                    } else {

                        showLogin();
                    }
                }
            );


        /* ==============================
           INICIAR
        ============================== */

        checkSession();


        /* ==============================
           ELEMENTOS DO ORÇAMENTO
        ============================== */

        const itemsContainer =
            document.getElementById(
                'itemsContainer'
            );

        const addItemBtn =
            document.getElementById(
                'addItemBtn'
            );

        const totalValue =
            document.getElementById(
                'totalValue'
            );

        const generatePdfBtn =
            document.getElementById(
                'generatePdfBtn'
            );


        /* ==============================
           CONVERTER DINHEIRO
        ============================== */

        function parseMoney(value) {

            if (!value) {
                return 0;
            }

            let text =
                String(value).trim();

            text = text
                .replace(/R\$/gi, '')
                .replace(/\s/g, '');

            if (
                text.includes('.') &&
                text.includes(',')
            ) {

                text = text
                    .replace(/\./g, '')
                    .replace(',', '.');

            } else {

                text =
                    text.replace(',', '.');
            }

            const number =
                parseFloat(text);

            return isNaN(number)
                ? 0
                : number;
        }


        /* ==============================
           FORMATAR DINHEIRO
        ============================== */

        function formatMoney(value) {

            return value.toLocaleString(
                'pt-BR',
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );
        }


        /* ==============================
           CALCULAR TOTAL
        ============================== */

        function calculateTotal() {

            const rows =
                document.querySelectorAll(
                    '#itemsContainer .item-row'
                );

            let total = 0;

            rows.forEach(row => {

                const quantityInput =
                    row.querySelector(
                        '.item-quantity'
                    );

                const priceInput =
                    row.querySelector(
                        '.item-price'
                    );

                let quantity =
                    parseFloat(
                        quantityInput.value
                    );

                if (
                    isNaN(quantity) ||
                    quantity <= 0
                ) {
                    quantity = 1;
                }

                const price =
                    parseMoney(
                        priceInput.value
                    );

                total +=
                    quantity * price;
            });

            totalValue.textContent =
                'R$ ' +
                formatMoney(total);

            return total;
        }


        /* ==============================
           EVENTO DE QUANTIDADE
        ============================== */

        function attachQuantityEvent(input) {

            input.addEventListener(
                'input',
                () => {
                    calculateTotal();
                }
            );
        }


        /* ==============================
           EVENTO DE PREÇO
        ============================== */

        function attachPriceEvent(input) {

            input.addEventListener(
                'input',
                () => {
                    calculateTotal();
                }
            );
        }


        /* ==============================
           REMOVER ITEM
        ============================== */

        function attachRemoveEvent(
            button,
            row
        ) {

            button.addEventListener(
                'click',
                () => {

                    row.remove();

                    calculateTotal();
                }
            );
        }


        /* ==============================
           ADICIONAR ITEM
        ============================== */

        addItemBtn.addEventListener(
            'click',
            () => {

                const row =
                    document.createElement(
                        'div'
                    );

                row.className =
                    'item-row';

                row.innerHTML = `
                    <input
                        type="number"
                        class="item-quantity"
                        min="1"
                        step="1"
                        value="1"
                        placeholder="Qtd."
                    >

                    <input
                        type="text"
                        class="item-desc"
                        placeholder="Descrição"
                    >

                    <input
                        type="text"
                        inputmode="decimal"
                        class="item-price"
                        placeholder="R$ 0,00"
                    >

                    <div class="item-actions">

                        <button
                            type="button"
                            class="btn-remove"
                        >
                            🗑️ Remover item
                        </button>

                    </div>
                `;

                itemsContainer.appendChild(
                    row
                );

                const quantityInput =
                    row.querySelector(
                        '.item-quantity'
                    );

                attachQuantityEvent(
                    quantityInput
                );

                const priceInput =
                    row.querySelector(
                        '.item-price'
                    );

                attachPriceEvent(
                    priceInput
                );

                const removeButton =
                    row.querySelector(
                        '.btn-remove'
                    );

                attachRemoveEvent(
                    removeButton,
                    row
                );

                calculateTotal();
            }
        );


        /* ==============================
           PRIMEIRO ITEM
        ============================== */

        const firstQuantity =
            document.querySelector(
                '.item-quantity'
            );

        const firstPrice =
            document.querySelector(
                '.item-price'
            );

        attachQuantityEvent(
            firstQuantity
        );

        attachPriceEvent(
            firstPrice
        );


        /* ==============================
           GERAR PDF
        ============================== */

        generatePdfBtn.addEventListener(
            'click',
            () => {

                try {

                    const clientName =
                        document
                            .getElementById(
                                'clientName'
                            )
                            .value
                            .trim();

                    const clientPhone =
                        document
                            .getElementById(
                                'clientPhone'
                            )
                            .value
                            .trim();

                    const clientValidade =
                        document
                            .getElementById(
                                'clientvalidade'
                            )
                            .value
                            .trim();

                    if (!clientName) {

                        alert(
                            'Por favor, informe o nome do cliente.'
                        );

                        return;
                    }

                    if (
                        typeof window.jspdf ===
                        'undefined'
                    ) {

                        alert(
                            'O sistema de PDF não foi carregado. ' +
                            'Verifique sua conexão com a internet.'
                        );

                        return;
                    }

                    const {
                        jsPDF
                    } = window.jspdf;

                    const doc =
                        new jsPDF({
                            orientation: 'portrait',
                            unit: 'mm',
                            format: 'a4'
                        });

                    const pageWidth =
                        doc.internal.pageSize.getWidth();

                    const pageHeight =
                        doc.internal.pageSize.getHeight();

                    const marginLeft = 18;
                    const marginRight = 18;
                    const marginTop = 18;
                    const marginBottom = 18;

                    const contentWidth =
                        pageWidth -
                        marginLeft -
                        marginRight;

                    let y =
                        marginTop;


                    /* ==============================
                       TÍTULO
                    ============================== */

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.setFontSize(18);

                    doc.setTextColor(
                        7,
                        102,
                        255
                    );

                    doc.text(
                        'ELETRONICA NOSSA SENHORA APARECIDA',
                        marginLeft,
                        y
                    );

                    y += 6;

                    doc.setFont(
                        'helvetica',
                        'normal'
                    );

                    doc.setFontSize(10);

                    doc.setTextColor(
                        40,
                        40,
                        40
                    );

                    doc.text(
                        'Rua Campo Mourão 1085',
                        marginLeft,
                        y
                    );

                    y += 5;

                    doc.text(
                        'Colombo - Parana',
                        marginLeft,
                        y
                    );

                    y += 5;

                    doc.text(
                        'Telefone: (41) 98409-7193',

                        y
                    );

                    y += 5;

                    doc.text(
                        'Contato: ADILSON',

                    );

                    y += 9;

                    doc.setLineWidth(

                    );

                    doc.line(
                        marginLeft,

                    );

                    y += 12;


                    /* ==============================
                       CLIENTE

                    doc.setFontSize(11);

                    doc.setTextColor(
                        40,
                        40,
                        40

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.text(

                        marginLeft,

                    doc.setFont(
                        'helvetica',
                        'normal'
                    );

                    doc.text(
                        clientName,
                        marginLeft + 22,

                    );

                    y += 7;

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.text(
                        'Telefone:',
                        marginLeft,
                        y
                    );

                    doc.setFont(
                        'helvetica',
                        'normal'
                    );

                    doc.text(
                        clientPhone ||
                        'Não informado',
                        marginLeft + 24,
                        y
                    );

                    y += 7;

                    doc.setFont(
                        'helvetica',

                    doc.text(

                    doc.text(

                            ),

                    );

                    y += 7;

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.text(
                        'Validade:',
                        marginLeft,
                        y
                    );

                    doc.setFont(
                        'helvetica',
                        'normal'
                    );

                    doc.text(
                        clientValidade
                            ? clientValidade + ' dias'
                            : 'Não informado',
                        marginLeft + 22,
                        y
                    );

                    y += 13;


                    /* ==============================
                       TABELA
                    ============================== */

                    const quantityWidth = 20;
                    const priceWidth = 42;

                    const descriptionWidth =
                        contentWidth -
                        quantityWidth -
                        priceWidth;

                    const headerHeight = 10;


                    /* CABEÇALHO */

                    doc.setFillColor(
                        241,
                        245,
                        249
                    );

                    doc.setDrawColor(
                        210,
                        210,
                        210
                    );

                    doc.rect(
                        marginLeft,
                        y,
                        quantityWidth,
                        headerHeight,
                        'FD'
                    );

                    doc.rect(
                        marginLeft +
                        quantityWidth,
                        y,
                        descriptionWidth,
                        headerHeight,
                        'FD'
                    );

                    doc.rect(
                        marginLeft +
                        quantityWidth +
                        descriptionWidth,
                        y,
                        priceWidth,
                        headerHeight,
                        'FD'
                    );

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.setFontSize(9);

                    doc.setTextColor(
                        40,
                        40,
                        40
                    );

                    doc.text(
                        'Qtd.',
                        marginLeft +
                        quantityWidth / 2,
                        y + 6.5,
                        {
                            align: 'center'
                        }
                    );

                    doc.text(
                        'Descrição',
                        marginLeft +
                        quantityWidth + 3,
                        y + 6.5
                    );

                    doc.text(
                        'Valor unit.',
                        marginLeft +
                        quantityWidth +
                        descriptionWidth +
                        priceWidth -
                        3,
                        y + 6.5,
                        {
                            align: 'right'
                        }
                    );

                    y += headerHeight;


                    /* ==============================
                       ITENS
                    ============================== */

                    const rows =
                        document.querySelectorAll(
                            '#itemsContainer .item-row'
                        );

                    let totalFinal = 0;

                    rows.forEach(
                        (row, index) => {

                            const quantityInput =
                                row.querySelector(
                                    '.item-quantity'
                                );

                            const descInput =
                                row.querySelector(
                                    '.item-desc'
                                );

                            const priceInput =
                                row.querySelector(
                                    '.item-price'
                                );

                            let quantity =
                                parseFloat(
                                    quantityInput.value
                                );

                            if (
                                isNaN(quantity) ||

                            ) {

                                parseMoney(

                            const itemTotal =

                            totalFinal +=

                            const lines =

                            const rowHeight =

                                    210,
                                    210
                                );

                                doc.rect(
                                    marginLeft,

                                    quantityWidth,
                                    headerHeight,
                                    'FD'
                                );

                                doc.rect(
                                    marginLeft +
                                    quantityWidth,
                                    y,
                                    descriptionWidth,
                                    headerHeight,
                                    'FD'
                                );

                                doc.rect(
                                    marginLeft +
                                    quantityWidth +
                                    descriptionWidth,
                                    y,
                                    priceWidth,
                                    headerHeight,
                                    'FD'
                                );

                                doc.setFont(
                                    'helvetica',
                                    'bold'
                                );

                                doc.setFontSize(9);

                                doc.setTextColor(
                                    40,
                                    40,
                                    40
                                );

                                doc.text(
                                    'Qtd.',
                                    marginLeft +
                                    quantityWidth / 2,
                                    y + 6.5,
                                    {
                                        align: 'center'
                                    }
                                );

                                doc.text(
                                    'Descrição',
                                    marginLeft +
                                    quantityWidth + 3,
                                    y + 6.5
                                );

                                doc.text(
                                    'Valor unit.',
                                    marginLeft +
                                    quantityWidth +
                                    descriptionWidth +
                                    priceWidth -
                                    3,
                                    y + 6.5,
                                    {
                                        align: 'right'
                                    }
                                );

                                y += headerHeight;
                            }


                            /* BORDAS */

                            doc.setDrawColor(
                                220,
                                220,
                                220
                            );

                            doc.rect(
                                marginLeft,
                                y,
                                quantityWidth,
                                rowHeight
                            );

                            doc.rect(
                                marginLeft +
                                quantityWidth,
                                y,
                                descriptionWidth,
                                rowHeight
                            );

                            doc.rect(
                                marginLeft +
                                quantityWidth +
                                descriptionWidth,
                                y,
                                priceWidth,
                                rowHeight
                            );


                            /* QUANTIDADE */

                            doc.setFont(
                                'helvetica',
                                'normal'
                            );

                            doc.setFontSize(10);

                            doc.setTextColor(
                                50,
                                50,
                                50
                            );

                            doc.text(
                                String(quantity),
                                marginLeft +
                                quantityWidth / 2,
                                y + 6,
                                {
                                    align: 'center'
                                }
                            );


                            /* DESCRIÇÃO */

                            doc.text(
                                lines,
                                marginLeft +
                                quantityWidth +
                                3,
                                y + 6
                            );


                            /* VALOR UNITÁRIO */

                            const priceText =
                                'R$ ' +
                                formatMoney(price);

                            doc.text(
                                priceText,
                                marginLeft +
                                quantityWidth +
                                descriptionWidth +
                                priceWidth -
                                3,
                                y + 6,
                                {
                                    align: 'right'
                                }
                            );

                            y += rowHeight;
                        }
                    );


                    /* ==============================
                       TOTAL
                    ============================== */

                    if (
                        y + 20 >
                        pageHeight -
                        marginBottom
                    ) {

                        doc.addPage();

                        y =
                            marginTop;
                    }

                    y += 8;

                    const totalHeight = 12;

                    const totalLabelWidth =
                        quantityWidth +
                        descriptionWidth;

                    doc.setFillColor(
                        248,
                        250,
                        252
                    );

                    doc.setDrawColor(
                        210,
                        210,
                        210
                    );

                    doc.rect(
                        marginLeft,
                        y,
                        totalLabelWidth,
                        totalHeight,
                        'FD'
                    );

                    doc.rect(
                        marginLeft +
                        totalLabelWidth,
                        y,
                        priceWidth,
                        totalHeight,
                        'FD'
                    );

                    doc.setFont(
                        'helvetica',
                        'bold'
                    );

                    doc.setFontSize(12);

                    doc.setTextColor(
                        40,
                        40,
                        40
                    );

                    doc.text(
                        'TOTAL',
                        marginLeft + 3,
                        y + 8
                    );

                    doc.setTextColor(
                        7,
                        102,
                        255
                    );

                    doc.text(
                        'R$ ' +
                        formatMoney(totalFinal),
                        marginLeft +
                        totalLabelWidth +
                        priceWidth -
                        3,
                        y + 8,
                        {
                            align: 'right'
                        }
                    );


                    /* ==============================
                       RODAPÉ
                    ============================== */

                    const pageCount =
                        doc.internal
                            .getNumberOfPages();

                    for (
                        let page = 1;
                        page <= pageCount;
                        page++
                    ) {

                        doc.setPage(page);

                        doc.setFont(
                            'helvetica',
                            'normal'
                        );

                        doc.setFontSize(8);

                        doc.setTextColor(
                            130,
                            130,
                            130
                        );

                        doc.text(
                            'Orçamento gerado pelo OrçaPrático',
                            marginLeft,
                            pageHeight - 9
                        );

                        doc.text(
                            'Página ' +
                            page +
                            ' de ' +
                            pageCount,
                            pageWidth -
                            marginRight,
                            pageHeight - 9,
                            {
                                align: 'right'
                            }
                        );
                    }


                    /* ==============================
                       NOME DO ARQUIVO
                    ============================== */

                    const safeName =
                        clientName
                            .replace(
                                /[\\/:*?"<>|]/g,
                                ''
                            )
                            .replace(
                                /\s+/g,
                                '_'
                            );

                    const fileName =
                        'Orcamento_' +
                        safeName +
                        '.pdf';


                    /* ==============================
                       SALVAR
                    ============================== */

                    doc.save(fileName);

                } catch (error) {

                    console.error(
                        'Erro ao gerar PDF:',
                        error
                    );

                    alert(
                        'Erro ao gerar o PDF:\n\n' +
                        error.message
                    );
                }
            }
        );


        /* ==============================
           TOTAL INICIAL
        ============================== */

        calculateTotal();

    </script>
